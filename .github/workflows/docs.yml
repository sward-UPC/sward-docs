# Build + deploy de la documentación (Docusaurus) a GitHub Pages.
#
# NOTA — repositorios privados:
#   GitHub Pages en repos PRIVADOS requiere un plan de pago. Si este repo es
#   privado y está en un plan gratuito, el deploy a Pages fallará. En local:
#       npm ci && npm run build && npm run serve  ->  http://localhost:3000
#   Si el repo es público (o el plan lo permite), este workflow publica en cada
#   push a main.

name: Documentación

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo deploy concurrente.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build (Docusaurus)
        run: npm run build

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
