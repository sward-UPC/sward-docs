# Build + deploy de la documentación (MkDocs Material) a GitHub Pages.
#
# NOTA IMPORTANTE — repositorios privados:
#   GitHub Pages en repos PRIVADOS requiere un plan de pago (GitHub Pro / Team /
#   Enterprise). Si este repo es privado y está en un plan gratuito, el deploy a
#   Pages fallará. En ese caso, la documentación se ve igual en local con:
#       pip install -r requirements.txt && mkdocs serve   ->  http://localhost:8000
#   Si el repo se hace público (o el plan lo permite), este workflow publica el
#   sitio automáticamente en cada push a main.

name: Documentación

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo deploy concurrente.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Build (estricto)
        run: mkdocs build --strict

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
