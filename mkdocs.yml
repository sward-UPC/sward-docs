site_name: "SWARD · Documentación"
site_description: "Documentación central de SWARD — tutor adaptativo y explicable (SAKT + pyKT) sobre microservicios hexagonales event-driven en AWS."
site_author: "sward-UPC"
copyright: "© SWARD · sward-UPC — Sistema Web de Recomendación Adaptativa y Explicable"

repo_url: https://github.com/sward-UPC/sward-docs
repo_name: sward-UPC/sward-docs
edit_uri: edit/main/docs/

theme:
  name: material
  language: es
  icon:
    logo: material/school
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.action.edit
    - toc.follow

nav:
  - Inicio: index.md
  - Arquitectura: arquitectura.md
  - Operaciones: operaciones.md
  - Secrets: secrets-runbook.md
  - Diagramas:
      - Resumen: diagramas.md
      - DKT y pyKT: diagramas-dkt.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
      toc_depth: 3

plugins:
  - search:
      lang: es
